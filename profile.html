<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - SkillHub</title><style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        background: #f5f7fb;
        color: #222;
    }

    .sidebar {
        position: fixed;
        width: 240px;
        height: 100vh;
        background: #111827;
        color: white;
        padding: 25px 15px;
    }

    .logo {
        font-size: 24px;
        font-weight: bold;
        text-align: center;
        margin-bottom: 35px;
    }

    .logo span {
        color: #6366f1;
    }

    .nav a {
        display: block;
        padding: 13px 15px;
        margin: 5px 0;
        text-decoration: none;
        color: #cbd5e1;
        border-radius: 8px;
    }

    .nav a:hover,
    .nav a.active {
        background: #6366f1;
        color: white;
    }

    .main {
        margin-left: 240px;
        padding: 30px;
    }

    h1 {
        font-size: 30px;
        margin-bottom: 8px;
    }

    .subtitle {
        color: #64748b;
        margin-bottom: 25px;
    }

    .profile-card {
        max-width: 850px;
        background: white;
        padding: 30px;
        border-radius: 14px;
        box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .profile-header {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 30px;
        padding-bottom: 20px;
        border-bottom: 1px solid #e5e7eb;
    }

    .avatar {
        width: 75px;
        height: 75px;
        border-radius: 50%;
        background: #6366f1;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
        font-weight: bold;
    }

    .profile-header h2 {
        margin-bottom: 5px;
    }

    .profile-header p {
        color: #64748b;
    }

    .form-row {
        display: flex;
        gap: 20px;
        margin-bottom: 20px;
        flex-wrap: wrap;
    }

    .form-group {
        flex: 1;
        min-width: 250px;
    }

    label {
        display: block;
        font-weight: bold;
        margin-bottom: 7px;
    }

    input,
    select {
        width: 100%;
        padding: 12px;
        border: 1px solid #d1d5db;
        border-radius: 7px;
        outline: none;
    }

    input:focus,
    select:focus {
        border-color: #6366f1;
    }

    input[readonly] {
        background: #f1f5f9;
        color: #64748b;
    }

    .save-btn {
        margin-top: 10px;
        padding: 12px 25px;
        border: none;
        border-radius: 7px;
        background: #6366f1;
        color: white;
        cursor: pointer;
        font-size: 15px;
    }

    .save-btn:hover {
        background: #4f46e5;
    }

    .status {
        margin-top: 15px;
        padding: 12px;
        border-radius: 7px;
        display: none;
    }

    .success {
        display: block;
        background: #dcfce7;
        color: #166534;
    }

    .error {
        display: block;
        background: #fee2e2;
        color: #991b1b;
    }

    .loading {
        text-align: center;
        padding: 30px;
        color: #64748b;
    }

    @media(max-width: 800px) {
        .sidebar {
            width: 190px;
        }

        .main {
            margin-left: 190px;
            padding: 20px;
        }
    }
</style>

</head>
<body>
    
    <aside id="sidebar"></aside>
    <script src="sidebar.js"></script>

<div class="main"><h1>My Profile</h1>

<p class="subtitle">
    View and update your student information.
</p>


<div id="loading" class="loading">
    Loading profile...
</div>


<div id="profileCard" class="profile-card" style="display:none;">

    <div class="profile-header">

        <div class="avatar" id="avatar">
            S
        </div>

        <div>
            <h2 id="profileName">
                Student
            </h2>

            <p id="profileDepartment">
                Computer Engineering
            </p>
        </div>

    </div>


    <div class="form-row">

        <div class="form-group">

            <label>Student ID</label>

            <input
                type="text"
                id="studentId"
                readonly>

        </div>


        <div class="form-group">

            <label>Name</label>

            <input
                type="text"
                id="name">

        </div>

    </div>


    <div class="form-row">

        <div class="form-group">

            <label>Email</label>

            <input
                type="email"
                id="email">

        </div>


        <div class="form-group">

            <label>Department</label>

            <input
                type="text"
                id="department">

        </div>

    </div>


    <div class="form-row">

        <div class="form-group">

            <label>Semester</label>

            <select id="semester">

                <option value="1st Semester">
                    1st Semester
                </option>

                <option value="2nd Semester">
                    2nd Semester
                </option>

                <option value="3rd Semester">
                    3rd Semester
                </option>

                <option value="4th Semester">
                    4th Semester
                </option>

                <option value="5th Semester">
                    5th Semester
                </option>

                <option value="6th Semester">
                    6th Semester
                </option>

            </select>

        </div>


        <div class="form-group">

            <label>Primary Skill</label>

            <input
                type="text"
                id="primarySkill"
                placeholder="Example: JavaScript">

        </div>

    </div>


    <button
        class="save-btn"
        onclick="updateProfile()">
        Save Changes
    </button>


    <div id="status" class="status"></div>

</div>

</div><script src="student-session.js"></script><script>

const API_URL =
    "http://localhost:5000/api/students/profile";


// ==========================================
// LOAD PROFILE
// ==========================================

async function loadProfile() {

    const studentId = getCurrentStudent();

    if (!studentId) {

        document.getElementById("loading").textContent =
            "No current student selected. Please select a student from the Students page.";

        return;
    }

    try {

        const response = await fetch(
            API_URL + "/" + encodeURIComponent(studentId)
        );

        const result = await response.json();

        if (!result.success) {
            throw new Error(result.message);
        }

        const student = result.data;


        document.getElementById("studentId").value =
            student.studentId;

        document.getElementById("name").value =
            student.name;

        document.getElementById("email").value =
            student.email;

        document.getElementById("department").value =
            student.department;

        document.getElementById("semester").value =
            student.semester;

        document.getElementById("primarySkill").value =
            student.primarySkill;


        document.getElementById("profileName").textContent =
            student.name;

        document.getElementById("profileDepartment").textContent =
            student.department;


        const firstLetter =
            student.name.charAt(0).toUpperCase();

        document.getElementById("avatar").textContent =
            firstLetter;


        document.getElementById("loading").style.display =
            "none";

        document.getElementById("profileCard").style.display =
            "block";


    } catch (error) {

        document.getElementById("loading").textContent =
            "Error loading profile: " + error.message;

    }

}


// ==========================================
// UPDATE PROFILE
// ==========================================

async function updateProfile() {

    const studentId = getCurrentStudent();

    if (!studentId) {

        showStatus(
            "No current student selected. Please select a student first.",
            "error"
        );

        return;
    }


    const name =
        document.getElementById("name").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const department =
        document.getElementById("department").value.trim();

    const semester =
        document.getElementById("semester").value;

    const primarySkill =
        document.getElementById("primarySkill").value.trim();


    if (
        !name ||
        !email ||
        !department ||
        !semester ||
        !primarySkill
    ) {

        showStatus(
            "Please fill all fields.",
            "error"
        );

        return;
    }


    try {

        const response = await fetch(
            API_URL + "/" + encodeURIComponent(studentId),
            {
                method: "PUT",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    name: name,

                    email: email,

                    department: department,

                    semester: semester,

                    primarySkill: primarySkill

                })
            }
        );


        const result = await response.json();


        if (!result.success) {

            throw new Error(result.message);

        }


        document.getElementById("profileName").textContent =
            name;

        document.getElementById("profileDepartment").textContent =
            department;

        document.getElementById("avatar").textContent =
            name.charAt(0).toUpperCase();


        showStatus(
            "Profile updated successfully!",
            "success"
        );


    } catch (error) {

        showStatus(
            "Error: " + error.message,
            "error"
        );

    }

}


// ==========================================
// STATUS MESSAGE
// ==========================================

function showStatus(message, type) {

    const status =
        document.getElementById("status");

    status.textContent = message;

    status.className =
        "status " + type;

}


// ==========================================
// START
// ==========================================

loadProfile();

</script></body>
</html>
