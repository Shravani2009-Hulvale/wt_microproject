<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Skills - SkillHub</title><style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        background: #f5f7fb;
        color: #222;
    }

    .sidebar {
        position: fixed;
        width: 240px;
        height: 100vh;
        background: #111827;
        color: white;
        padding: 25px 15px;
    }

    .logo {
        font-size: 24px;
        font-weight: bold;
        text-align: center;
        margin-bottom: 35px;
    }

    .logo span {
        color: #6366f1;
    }

    .nav a {
        display: block;
        padding: 13px 15px;
        margin: 5px 0;
        text-decoration: none;
        color: #cbd5e1;
        border-radius: 8px;
    }

    .nav a:hover,
    .nav a.active {
        background: #6366f1;
        color: white;
    }

    .main {
        margin-left: 240px;
        padding: 30px;
    }

    .header h1 {
        font-size: 30px;
        margin-bottom: 8px;
    }

    .header p {
        color: #64748b;
        margin-bottom: 25px;
    }

    .search-box {
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        margin-bottom: 25px;
    }

    .form-row {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
    }

    .form-group {
        flex: 1;
        min-width: 220px;
    }

    label {
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
    }

    input,
    select {
        width: 100%;
        padding: 12px;
        border: 1px solid #d1d5db;
        border-radius: 7px;
        outline: none;
    }

    input:focus,
    select:focus {
        border-color: #6366f1;
    }

    button {
        margin-top: 25px;
        padding: 12px 25px;
        border: none;
        border-radius: 7px;
        background: #6366f1;
        color: white;
        cursor: pointer;
        font-size: 15px;
    }

    button:hover {
        background: #4f46e5;
    }

    .stats {
        display: flex;
        gap: 20px;
        margin-bottom: 25px;
        flex-wrap: wrap;
    }

    .stat-card {
        background: white;
        padding: 20px;
        border-radius: 12px;
        flex: 1;
        min-width: 180px;
        box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .stat-card h2 {
        color: #6366f1;
        margin-bottom: 5px;
    }

    .stat-card p {
        color: #64748b;
    }

    .results {
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        overflow-x: auto;
    }

    .results h2 {
        margin-bottom: 20px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    th,
    td {
        padding: 13px;
        text-align: left;
        border-bottom: 1px solid #e5e7eb;
    }

    th {
        background: #f8fafc;
    }

    .badge {
        padding: 5px 10px;
        border-radius: 20px;
        background: #e0e7ff;
        color: #4338ca;
        font-size: 13px;
    }

    .empty {
        text-align: center;
        padding: 30px;
        color: #64748b;
    }

    @media(max-width: 800px) {
        .sidebar {
            width: 190px;
        }

        .main {
            margin-left: 190px;
            padding: 20px;
        }
    }
</style>

</head>
<body>
    
    <aside id="sidebar"></aside>
    <script src="sidebar.js"></script>

<div class="main">

    <div class="header">
        <h1>Find Skills</h1>
        <p>Find students who have the skills you need.</p>
    </div>

    <div class="search-box">

        <div class="form-row">

            <div class="form-group">
                <label>Skill Name</label>

                <input
                    type="text"
                    id="skillInput"
                    placeholder="Example: JavaScript">
            </div>

            <div class="form-group">
                <label>Skill Level</label>

                <select id="levelInput">
                    <option value="All">All Levels</option>
                    <option value="Beginner">Beginner</option>
                    <option value="Intermediate">Intermediate</option>
                    <option value="Advanced">Advanced</option>
                </select>
            </div>

        </div>

        <button onclick="findSkills()">Search Students</button>

    </div>

    <div class="stats">

        <div class="stat-card">
            <h2 id="totalResults">0</h2>
            <p>Students Found</p>
        </div>

        <div class="stat-card">
            <h2 id="skillResults">-</h2>
            <p>Skill Searched</p>
        </div>

    </div>

    <div class="results">

        <h2>Search Results</h2>

        <div id="resultArea">
            <div class="empty">
                Enter a skill and click Search Students.
            </div>
        </div>

    </div>

</div>

<script>

    const API_URL = "http://localhost:5000/api/students/find";


    // Load skill from Dashboard search
    window.addEventListener("DOMContentLoaded", () => {

        const params = new URLSearchParams(window.location.search);

        const searchSkill = params.get("search");

        if (searchSkill) {

            document.getElementById("skillInput").value =
                searchSkill;

            findSkills();
        }

    });


    // Search when Enter key is pressed
    document.getElementById("skillInput").addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {
                findSkills();
            }

        }
    );


    async function findSkills() {

        const skill = document
            .getElementById("skillInput")
            .value
            .trim();

        const level = document
            .getElementById("levelInput")
            .value;

        if (!skill) {

            alert("Please enter a skill name.");

            return;
        }

        document.getElementById("resultArea").innerHTML =
            '<div class="empty">Searching...</div>';

        try {

            let url = API_URL +
                "?skill=" + encodeURIComponent(skill);

            if (level !== "All") {

                url += "&level=" +
                    encodeURIComponent(level);
            }

            const response = await fetch(url);

            const result = await response.json();

            if (!result.success) {

                throw new Error(result.message);
            }

            displayResults(result.data, skill);

        } catch (error) {

            console.error(error);

            document.getElementById("resultArea").innerHTML =
                `<div class="empty">
                    Error: ${error.message}
                </div>`;

        }

    }


    function displayResults(students, skill) {

        document.getElementById("totalResults").textContent =
            students.length;

        document.getElementById("skillResults").textContent =
            skill;

        if (students.length === 0) {

            document.getElementById("resultArea").innerHTML =
                `<div class="empty">
                    No students found with this skill.
                </div>`;

            return;
        }

        let table = `

            <table>

                <thead>

                    <tr>
                        <th>Student ID</th>
                        <th>Name</th>
                        <th>Department</th>
                        <th>Semester</th>
                        <th>Skill</th>
                        <th>Level</th>
                        <th>Email</th>
                    </tr>

                </thead>

                <tbody>
        `;

        students.forEach(student => {

            table += `

                <tr>

                    <td>${student.studentId}</td>

                    <td>${student.name}</td>

                    <td>${student.department}</td>

                    <td>${student.semester}</td>

                    <td>${student.skillName}</td>

                    <td>
                        <span class="badge">
                            ${student.level}
                        </span>
                    </td>

                    <td>${student.email}</td>

                </tr>

            `;

        });

        table += `
                </tbody>
            </table>
        `;

        document.getElementById("resultArea").innerHTML = table;
    }

</script>

</body>
</html>
